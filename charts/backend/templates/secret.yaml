apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}-secret
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ .Values.backend.database.password | quote }}
  JWT_SECRET_KEY: {{ .Values.backend.jwtSecret | quote }}
  OPENAI_API_KEY: {{ .Values.backend.openaiApiKey | quote }}
