services:
  # Backend API Service
  - type: web
    name: todo-ai-chatbot-backend
    runtime: python
    region: oregon  # Change to your preferred region (oregon, frankfurt, singapore, ohio)
    plan: free  # Change to 'starter' for production ($7/month)
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: JWT_SECRET_KEY
        generateValue: true  # Render will auto-generate
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 43200
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://todo-ai-chatbot-six.vercel.app
